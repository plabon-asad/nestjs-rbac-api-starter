services:
  api:
    profiles: ['app']
    build:
      context: .
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: unless-stopped
    # DATABASE_URL points at the in-network database; everything else comes from .env.
    # For MySQL, swap DATABASE_PROVIDER plus the URL and depends_on accordingly.
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: postgresql://rbac:${POSTGRES_PASSWORD}@postgres:5432/rbac_dev
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rbac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rbac_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rbac']
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: rbac_dev
      MYSQL_USER: rbac
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  mysql-data:
